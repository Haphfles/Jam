<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10271e"><meta name="referrer" content="no-referrer"><title>GREENLIGHT — Your instrument</title><link rel="stylesheet" href="./styles.css"><script type="module" src="./controller.js"></script></head><body class="controller-body"><header class="topbar"><a class="brand" href="./">GREENLIGHT<span class="brand-small">BAND</span></a><span class="connection" id="phone-network">PHONE CONTROLLER</span></header><main class="phone-page"><button id="exit-play" class="secondary">Back to room</button><button id="enable-sound" class="secondary">Enable sound / full screen</button><div class="eyebrow">YOUR PHONE. YOUR INSTRUMENT.</div><h1 id="phone-title">Join the band.</h1><p id="phone-status" role="status">Hear yourself immediately and the whole band live.</p><form id="connect-form"><label for="phone-name">Your name</label><input id="phone-name" maxlength="24" placeholder="Name or nickname" autocomplete="nickname"><button id="connect" class="primary">Connect to the stage ↗</button></form><section id="phone-session" class="hidden"><div class="phone-clock"><strong>LIVE PLAY</strong><span id="phone-route">Connecting…</span></div><p id="latency" class="small-note">Synchronizing…</p><div id="phone-controls" class="instrument-controls"></div><div class="volume-panel"><label>Instrument volume <input id="track-volume" type="range" min="0" max="100" value="75"></label><p id="command-status" role="status"></p></div><p class="control-hint">Tap to play. Keep this page visible.<br>Use headphones when playing near other devices.</p><button id="disconnect" class="secondary">Leave the stage</button></section></main><div id="toast" class="toast hidden" role="status"></div></body></html>
