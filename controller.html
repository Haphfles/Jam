<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10271e"><meta name="referrer" content="no-referrer"><title>GREENLIGHT — Your instrument</title><link rel="stylesheet" href="./styles.css"><script type="module" src="./controller.js"></script></head><body class="controller-body"><header class="topbar"><a class="brand" href="./">GREENLIGHT<span class="brand-small">BAND</span></a><span class="connection" id="phone-network">PHONE CONTROLLER</span></header><main class="phone-page"><div class="eyebrow">YOUR PHONE. YOUR INSTRUMENT.</div><h1 id="phone-title">Join the band.</h1><p id="phone-status" role="status">Sound will play on the host computer.</p><form id="connect-form"><label for="phone-name">Your name</label><input id="phone-name" maxlength="24" placeholder="Name or nickname" autocomplete="nickname"><button id="connect" class="primary">Connect to the stage ↗</button></form><section id="phone-session" class="hidden"><div class="phone-clock"><strong id="phone-tempo">100 BPM</strong><span id="phone-beat">Waiting for the clock</span></div><p id="latency" class="small-note">Synchronizing…</p><div id="phone-controls" class="instrument-controls"></div><div class="loop-panel"><span id="phone-loop-status">No loop yet</span><div class="loop-actions"><button data-action="record" class="secondary">Record 4-bar loop</button><button data-action="loop-start" class="secondary">Start loop</button><button data-action="loop-stop" class="secondary">Stop loop</button><button data-action="clear" class="secondary">Clear loop</button></div><label>Instrument volume <input id="track-volume" type="range" min="0" max="100" value="75"></label><p id="command-status" role="status"></p></div><p class="control-hint">Tap to play. Keep this page visible.<br>Sound comes from the host computer.</p><button id="disconnect" class="secondary">Leave the stage</button></section></main><div id="toast" class="toast hidden" role="status"></div></body></html>
