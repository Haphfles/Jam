<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#093d09"><meta name="referrer" content="no-referrer"><title>GREENLIGHT JAMMER — Instrument</title><link rel="stylesheet" href="./styles.css"><script type="module" src="./controller.js"></script></head><body class="controller-body"><header class="topbar"><a class="brand" href="./" aria-label="GREENLIGHT JAMMER home"><img class="brand-logo" src="./assets/greenlight-logo.svg" alt="GREENLIGHT"><span class="brand-name">JAMMER</span></a><span id="phone-network" class="connection">OFFLINE</span></header><main class="phone-page"><div class="play-toolbar"><button id="exit-play">Back</button><h1 id="phone-title">Join band</h1><button id="enable-sound">Sound / fullscreen</button></div><p id="phone-status" role="status">Connect to play.</p><form id="connect-form"><label for="phone-name">Name</label><input id="phone-name" maxlength="24" autocomplete="nickname" placeholder="Your name"><label for="join-instrument">Instrument</label><select id="join-instrument"><option value="">Any available instrument</option><option value="guitar">Guitar</option><option value="bass">Bass</option><option value="synth">Synth</option><option value="drums">Drums</option><option value="percussion">Percussion</option></select><p class="small-note">If occupied, wait for that instrument or choose another after joining.</p><button id="connect" class="primary">Join</button></form><section id="phone-session" class="hidden"><label class="instrument-picker">Instrument<select id="phone-instrument" aria-label="Change instrument"><option value="">Waiting</option><option value="guitar">Guitar</option><option value="bass">Bass</option><option value="synth">Synth</option><option value="drums">Drums</option><option value="percussion">Percussion</option></select></label><p id="instrument-status" role="status"></p><div id="phone-controls" class="instrument-controls"></div><div class="volume-panel"><label>Volume <input id="track-volume" type="range" min="0" max="100" value="75"></label><button id="disconnect">Leave band</button></div><p id="command-status" role="status"></p><details class="connection-details"><summary>Connection</summary><span id="phone-route"></span><p id="latency"></p></details></section></main><div id="toast" class="toast hidden" role="status"></div></body></html>
